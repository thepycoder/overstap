server:
  port: 8080
  web_folder: ui
osm: belgium.osm.pbf
timetable:
  first_day: TODAY
  num_days: 14
  railviz: true
  with_shapes: false
  adjust_footpaths: true
  link_stop_distance: 100
  update_interval: 60
  http_timeout: 30
  max_footpath_length: 15
  default_transfer_time: 2
  datasets:
    sncb:
      path: sncb.zip
      default_bikes_allowed: true
      rt:
        - url: https://sncb-opendata.hafas.de/gtfs/realtime/c21ac6758dd25af84cca5b707f3cb3de
    delijn:
      path: delijn.zip
      rt:
        - url: https://api-management-opendata-production.azure-api.net/api/gtfs/feed/delijn/rt/trip-update?format=protobuf
gbfs:
  feeds:
    blue-bike:
      url: https://api.delijn.be/gbfs/gbfs.json
    velo-antwerpen:
      url: https://gbfs.smartbike.com/antwerp/1.0/gbfs.json
    donkey-antwerp:
      url: https://stables.donkey.bike/api/public/gbfs/3.0/donkey_antwerp/gbfs.json
    donkey-ghent:
      url: https://stables.donkey.bike/api/public/gbfs/3.0/donkey_gh/gbfs.json
    dott-ghent:
      url: https://gbfs.api.ridedott.com/public/v2/ghent/gbfs.json
    # Added 2026-11-05 after tools/hub_coverage.py (TODO-sharing.md A12, A10, B16, B3).
    nextbike-vlaamse-rand:  # docked; hub-only fix in lastmile.rs
      url: https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_hf/gbfs.json
    donkey-westhoek:
      url: https://stables.donkey.bike/api/public/gbfs/3.0/donkey_westhoek/gbfs.json
    lime-kortrijk:  # free-floating e-bikes
      url: https://data.lime.bike/api/partners/v2/gbfs/kortrijk/gbfs.json
    voi-antwerp-brussels:  # one feed for both cities: e-bikes + steps
      url: https://api.voiapp.io/gbfs/be/7a4cb689-a2ee-409d-a5fe-49d2e8d50717/v2/gbfs.json
    # No public feed: generated by tools/hoppy_gbfs.py (static, availability assumed; ADR-011).
    # A local directory path makes MOTIS read <dir>/gbfs.json etc. instead of fetching.
    hoppy-kempen:
      url: gbfs/hoppy-kempen
    hoppy-dender-vlaamse-ardennen:  # one network: return across both regions
      url: gbfs/hoppy-dender-vlaamse-ardennen
    hoppy-brugge:
      url: gbfs/hoppy-brugge
    hoppy-midwest:
      url: gbfs/hoppy-midwest
    hoppy-westhoek:
      url: gbfs/hoppy-westhoek
    hoppy-limburg:  # Genk city network
      url: gbfs/hoppy-limburg
street_routing: true
osr_footpath: true
geocoding: true
reverse_geocoding: true
